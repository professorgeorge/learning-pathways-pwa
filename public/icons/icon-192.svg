<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="#090d16"/>
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="url(#bg)" stroke-width="3" opacity="0.6"/>
  <circle cx="96" cy="96" r="56" fill="url(#bg)" filter="url(#glow)" opacity="0.25"/>
  <!-- Intersecting pathway curves symbolizing multi-modal learning pathways -->
  <path d="M 46,136 C 60,70 120,60 146,100" fill="none" stroke="url(#bg)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 52,70 C 86,120 130,126 144,60" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- Nodes on pathways -->
  <circle cx="60" cy="116" r="8" fill="#ffffff"/>
  <circle cx="96" cy="74" r="9" fill="#f43f5e"/>
  <circle cx="132" cy="112" r="8" fill="#38bdf8"/>
</svg>
